[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow-cli"
version = "0.3.2"
description = "Load versioned dataset packs and run processing pipelines"
requires-python = ">=3.9"

[project.scripts]
dataflow = "dataflow_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dataflow_cli*"]
